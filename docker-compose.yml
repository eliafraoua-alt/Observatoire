version: "3.9"

# ─── Observatoire RPDF — stack dev complète ───────────────────────────────────
# Usage : docker compose up -d
# Airflow : http://localhost:8080  (admin / admin)
# API     : http://localhost:8000/docs
# Dashboard : http://localhost:8501
# MinIO   : http://localhost:9001  (minioadmin / minioadmin)
# Grafana : http://localhost:3000  (admin / admin)

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.1-python3.11
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    PYTHONPATH: /opt/airflow
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: minioadmin
    MINIO_SECRET_KEY: minioadmin
    DUCKDB_PATH: /data/warehouse.duckdb
  volumes:
    - ./ingestion/dags:/opt/airflow/dags
    - ./ingestion:/opt/airflow/ingestion
    - ./warehouse:/opt/airflow/warehouse
    - ./processing:/opt/airflow/processing
    - ./ml:/opt/airflow/ml
    - ./nlp:/opt/airflow/nlp
    - airflow-logs:/opt/airflow/logs
    - duckdb-data:/data
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ── PostgreSQL (Airflow metadata) ────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  # ── MinIO (Data Lake S3-compatible) ─────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-05-01T01-11-10Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 5

  # ── Airflow init ─────────────────────────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        pip install -q minio duckdb requests pandas pyarrow scikit-learn prophet boto3 \
          lightgbm xgboost shap joblib feedparser beautifulsoup4 dbt-duckdb
        pip install -q spacy transformers torch --no-cache-dir
        python -m spacy download fr_core_news_sm || true
        airflow db init
        airflow users create --username admin --password admin \
          --firstname Admin --lastname User --role Admin --email admin@rpdf.fr
    restart: on-failure

  # ── Airflow webserver ────────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 3

  # ── Airflow scheduler ────────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── FastAPI ──────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DUCKDB_PATH: /data/warehouse.duckdb
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      API_KEY: ${API_KEY:-}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:8501,http://localhost:8511,http://localhost:8512,http://localhost:8513,http://localhost:8514}
    volumes:
      - duckdb-data:/data
      - ./api:/app
      - ./ml:/app/ml
      - ./nlp:/app/nlp
    depends_on:
      - minio

  # ── Streamlit Dashboard — Vue générale ───────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
      API_KEY: ${API_KEY:-}
    volumes:
      - ./dashboard:/app
    depends_on:
      - api

  # ── Dashboard 1/3 — Prévision d'emploi ───────────────────────────────────────
  dashboard-prevision:
    build:
      context: ./dashboard/prevision
      dockerfile: Dockerfile
    ports:
      - "8511:8511"
    environment:
      API_URL: http://api:8000
      API_KEY: ${API_KEY:-}
    volumes:
      - ./dashboard/prevision:/app
    depends_on:
      - api

  # ── Dashboard 2/3 — Risque de défaillance ────────────────────────────────────
  dashboard-defaillance:
    build:
      context: ./dashboard/defaillance
      dockerfile: Dockerfile
    ports:
      - "8512:8512"
    environment:
      API_URL: http://api:8000
      API_KEY: ${API_KEY:-}
    volumes:
      - ./dashboard/defaillance:/app
    depends_on:
      - api

  # ── Dashboard 3/3 — Dévitalisation commerciale ───────────────────────────────
  dashboard-devitalisation:
    build:
      context: ./dashboard/devitalisation
      dockerfile: Dockerfile
    ports:
      - "8513:8513"
    environment:
      API_URL: http://api:8000
      API_KEY: ${API_KEY:-}
    volumes:
      - ./dashboard/devitalisation:/app
    depends_on:
      - api

  # ── Dashboard 4/4 — Veille presse NLP ────────────────────────────────────────
  dashboard-presse:
    build:
      context: ./dashboard/presse
      dockerfile: Dockerfile
    ports:
      - "8514:8514"
    environment:
      API_URL: http://api:8000
      API_KEY: ${API_KEY:-}
    volumes:
      - ./dashboard/presse:/app
    depends_on:
      - api

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  # ── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

volumes:
  postgres-data:
  minio-data:
  duckdb-data:
  airflow-logs:
  grafana-data:
